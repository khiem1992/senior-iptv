name: Build Android TV IPTV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web GitHub

permissions:
  contents: write

jobs:
  build:
    name: Compile APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission and sanitize gradlew
        run: |
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS="-Xmx64m -Xms64m"/' gradlew || true
          fi

      - name: Ensure gradle-wrapper.jar exists
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar is missing or empty, downloading official v8.9 wrapper jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar ||             curl -sLo gradle/wrapper/gradle-wrapper.jar https://repo.gradle.org/artifactory/libs-releases/org/gradle/gradle-wrapper/8.9/gradle-wrapper-8.9.jar
          fi

      - name: Ensure AndroidX and Jetifier in gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          if [ -f "gradle.properties" ]; then
            grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
            grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          else
            echo "android.useAndroidX=true" > gradle.properties
            echo "android.enableJetifier=true" >> gradle.properties
          fi

      - name: Build Release & Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true || ./gradlew assembleDebug --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
          else
            gradle assembleDebug assembleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
          fi

      - name: Locate Output APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Senior-IPTV-AndroidTV-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Senior IPTV TV Release v1.0.0"
          body: |
            ## 📺 Bản cài đặt IPTV cho Sony Android TV & Google TV
            - Hỗ trợ Media3 ExoPlayer mới nhất
            - OSD chữ lớn 3 giây tự ẩn
            - Remote D-Pad Lên / Xuống / OK / Back
            - Tự kết nối lại mỗi 4s khi mất mạng
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
